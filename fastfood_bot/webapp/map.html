<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manzilni tanlang</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet GeoSearch CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-geosearch@3.11.1/dist/geosearch.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #1c1c1e);
            color: var(--tg-theme-text-color, #ffffff);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: var(--tg-theme-secondary-bg-color, #2c2c2e);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 1px 8px rgba(0,0,0,0.3);
            z-index: 1000;
            flex-shrink: 0;
        }

        .header-icon {
            font-size: 24px;
        }

        .header-title {
            font-size: 16px;
            font-weight: 600;
        }

        .header-subtitle {
            font-size: 12px;
            opacity: 0.6;
            margin-top: 1px;
        }

        /* Search bar */
        .search-bar {
            padding: 10px 16px;
            background: var(--tg-theme-secondary-bg-color, #2c2c2e);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
            z-index: 999;
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            font-size: 16px;
            pointer-events: none;
        }

        #searchInput {
            width: 100%;
            padding: 10px 12px 10px 38px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.07);
            color: var(--tg-theme-text-color, #fff);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        #searchInput::placeholder {
            color: rgba(255,255,255,0.35);
        }

        #searchInput:focus {
            border-color: rgba(255,140,0,0.6);
        }

        #searchResults {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: var(--tg-theme-secondary-bg-color, #2c2c2e);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            max-height: 200px;
            overflow-y: auto;
            display: none;
            z-index: 10000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .search-result-item {
            padding: 10px 14px;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            transition: background 0.15s;
            line-height: 1.4;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:hover, .search-result-item:active {
            background: rgba(255,140,0,0.15);
        }

        .search-result-item strong {
            display: block;
            color: var(--tg-theme-text-color, #fff);
        }

        .search-result-item span {
            color: rgba(255,255,255,0.5);
            font-size: 11px;
        }

        /* Map container */
        #map {
            flex: 1;
            z-index: 1;
        }

        /* Center pin overlay */
        .map-pin-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -100%);
            z-index: 500;
            pointer-events: none;
            transition: transform 0.15s ease;
        }

        .map-pin-overlay.dragging {
            transform: translate(-50%, -110%) scale(1.15);
        }

        .pin-icon {
            font-size: 40px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
            display: block;
        }

        /* Bottom panel */
        .bottom-panel {
            background: var(--tg-theme-secondary-bg-color, #2c2c2e);
            padding: 14px 16px 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
            z-index: 1000;
        }

        .address-box {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 14px;
            min-height: 36px;
        }

        .address-icon {
            font-size: 18px;
            margin-top: 2px;
            flex-shrink: 0;
        }

        #addressText {
            font-size: 14px;
            line-height: 1.5;
            color: var(--tg-theme-text-color, #fff);
            flex: 1;
        }

        #addressText.loading {
            color: rgba(255,255,255,0.45);
        }

        .confirm-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #ff8c00, #ff6000);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 4px 16px rgba(255,120,0,0.35);
        }

        .confirm-btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(255,120,0,0.25);
        }

        .confirm-btn:disabled {
            background: rgba(255,255,255,0.15);
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Locate me button */
        .locate-btn {
            position: absolute;
            bottom: 160px;
            right: 16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--tg-theme-secondary-bg-color, #2c2c2e);
            border: 1px solid rgba(255,255,255,0.15);
            color: var(--tg-theme-text-color, #fff);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
            z-index: 500;
            transition: transform 0.15s;
        }

        .locate-btn:active {
            transform: scale(0.93);
        }

        /* Leaflet overrides */
        .leaflet-control-zoom {
            display: none;
        }

        .leaflet-tile-pane {
            filter: brightness(0.85) saturate(0.9);
        }

        /* Spinner */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="header-icon">🗺</div>
        <div>
            <div class="header-title" id="headerTitle">Manzilni tanlang</div>
            <div class="header-subtitle" id="headerSub">Xaritada joy tanlang yoki qidiring</div>
        </div>
    </div>

    <!-- Search bar -->
    <div class="search-bar" style="position:relative;">
        <div class="search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Manzil qidiring..." autocomplete="off" />
        </div>
        <div id="searchResults"></div>
    </div>

    <!-- Map -->
    <div style="position:relative; flex:1; display:flex; flex-direction:column;">
        <div id="map"></div>
        <div class="map-pin-overlay" id="mapPin">
            <span class="pin-icon">📍</span>
        </div>
        <button class="locate-btn" onclick="locateMe()" title="Joylashuvimni aniqlash">📡</button>
    </div>

    <!-- Bottom panel -->
    <div class="bottom-panel">
        <div class="address-box">
            <span class="address-icon">🏠</span>
            <div id="addressText" class="loading">Xaritada joy tanlang...</div>
        </div>
        <button class="confirm-btn" id="confirmBtn" onclick="confirmLocation()" disabled>
            ✅ <span id="confirmText">Tasdiqlash</span>
        </button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ── Telegram WebApp ─────────────────────────────────────
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // ── Til aniqlash ─────────────────────────────────────────
        const langParam = new URLSearchParams(window.location.search).get('lang') || 'uz';

        const TEXTS = {
            uz: {
                header: 'Manzilni tanlang',
                sub: 'Xaritada joy tanlang yoki qidiring',
                search: 'Manzil qidiring...',
                selecting: 'Xaritada joy tanlang...',
                loading: '⏳ Manzil aniqlanmoqda...',
                confirm: 'Tasdiqlash',
                noAddress: 'Aniq manzil topilmadi'
            },
            ru: {
                header: 'Выберите адрес',
                sub: 'Выберите место на карте или найдите через поиск',
                search: 'Поиск адреса...',
                selecting: 'Выберите место на карте...',
                loading: '⏳ Определяем адрес...',
                confirm: 'Подтвердить',
                noAddress: 'Адрес не найден'
            },
            en: {
                header: 'Select Location',
                sub: 'Pick a place on the map or search',
                search: 'Search address...',
                selecting: 'Select a place on the map...',
                loading: '⏳ Getting address...',
                confirm: 'Confirm',
                noAddress: 'Address not found'
            }
        };

        const T = TEXTS[langParam] || TEXTS.uz;
        document.getElementById('headerTitle').textContent = T.header;
        document.getElementById('headerSub').textContent = T.sub;
        document.getElementById('searchInput').placeholder = T.search;
        document.getElementById('addressText').textContent = T.selecting;
        document.getElementById('confirmText').textContent = T.confirm;

        // ── Map init ─────────────────────────────────────────────
        // O'zbekiston markazi: Toshkent
        const DEFAULT_LAT = 41.2995;
        const DEFAULT_LON = 69.2401;
        const DEFAULT_ZOOM = 13;

        const map = L.map('map', {
            center: [DEFAULT_LAT, DEFAULT_LON],
            zoom: DEFAULT_ZOOM,
            zoomControl: false,
            attributionControl: false
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);

        // ── State ─────────────────────────────────────────────────
        let selectedLat = null;
        let selectedLon = null;
        let selectedAddress = null;
        let geocodeTimer = null;
        let isDragging = false;

        const mapPin = document.getElementById('mapPin');
        const addressText = document.getElementById('addressText');
        const confirmBtn = document.getElementById('confirmBtn');

        // ── Map events ────────────────────────────────────────────
        function onMapMove() {
            const center = map.getCenter();
            selectedLat = center.lat;
            selectedLon = center.lng;
            selectedAddress = null;
            confirmBtn.disabled = true;
            addressText.className = 'loading';
            addressText.textContent = T.loading;
            mapPin.className = 'map-pin-overlay dragging';

            clearTimeout(geocodeTimer);
            geocodeTimer = setTimeout(() => {
                reverseGeocode(selectedLat, selectedLon);
            }, 600);
        }

        function onMapMoveEnd() {
            mapPin.className = 'map-pin-overlay';
        }

        map.on('move', onMapMove);
        map.on('moveend', onMapMoveEnd);

        // Initial geocode
        setTimeout(() => {
            reverseGeocode(DEFAULT_LAT, DEFAULT_LON);
        }, 500);

        // ── Reverse geocode ───────────────────────────────────────
        async function reverseGeocode(lat, lon) {
            try {
                const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=17&addressdetails=1&accept-language=uz,ru`;
                const resp = await fetch(url, {
                    headers: { 'User-Agent': 'FastFoodBot/2.0' }
                });
                if (!resp.ok) throw new Error('Network error');
                const data = await resp.json();

                const addr = data.address || {};
                const SKIP = ['toshkent','samarqand','buxoro','namangan','andijon',
                              "farg'ona",'nukus','qarshi','termiz','jizzax','navoiy',
                              "o'zbekiston",'uzbekistan','republic','viloyat','tuman',
                              'district','region','city','shahar'];

                let result = null;
                for (const key of ['road','pedestrian','footway','path','neighbourhood',
                                   'quarter','residential','suburb','hamlet','village','city_district']) {
                    const val = (addr[key] || '').trim();
                    if (val && !SKIP.some(s => val.toLowerCase().includes(s))) {
                        result = val;
                        break;
                    }
                }

                if (!result) {
                    const parts = (data.display_name || '').split(',').map(p => p.trim());
                    for (const part of parts) {
                        if (part && !part.match(/^\d+$/) && !SKIP.some(s => part.toLowerCase().includes(s))) {
                            result = part;
                            break;
                        }
                    }
                }

                if (!result) result = T.noAddress;

                selectedAddress = result;
                addressText.className = '';
                addressText.textContent = result;
                confirmBtn.disabled = false;

            } catch (e) {
                selectedAddress = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
                addressText.className = '';
                addressText.textContent = selectedAddress;
                confirmBtn.disabled = false;
            }
        }

        // ── Confirm ───────────────────────────────────────────────
        function confirmLocation() {
            if (!selectedLat || !selectedLon) return;

            const payload = JSON.stringify({
                lat: selectedLat,
                lon: selectedLon,
                address: selectedAddress || `${selectedLat.toFixed(5)}, ${selectedLon.toFixed(5)}`
            });

            if (tg && tg.sendData) {
                tg.sendData(payload);
            } else {
                // Dev mode: alert
                alert('Yuborildi:\n' + payload);
            }
        }

        // ── Locate me ─────────────────────────────────────────────
        function locateMe() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const { latitude, longitude } = pos.coords;
                    map.setView([latitude, longitude], 16);
                },
                () => {},
                { timeout: 8000 }
            );
        }

        // ── Search ────────────────────────────────────────────────
        let searchTimer = null;
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');

        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            const q = searchInput.value.trim();
            if (q.length < 3) {
                searchResults.style.display = 'none';
                return;
            }
            searchTimer = setTimeout(() => doSearch(q), 500);
        });

        searchInput.addEventListener('blur', () => {
            setTimeout(() => { searchResults.style.display = 'none'; }, 200);
        });

        async function doSearch(query) {
            try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=uz&limit=5&addressdetails=1`;
                const resp = await fetch(url, { headers: { 'User-Agent': 'FastFoodBot/2.0' } });
                const data = await resp.json();

                searchResults.innerHTML = '';
                if (!data.length) {
                    searchResults.innerHTML = `<div class="search-result-item"><strong style="opacity:0.5">Natija topilmadi</strong></div>`;
                    searchResults.style.display = 'block';
                    return;
                }

                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'search-result-item';
                    const parts = (item.display_name || '').split(',');
                    div.innerHTML = `<strong>${parts[0]}</strong><span>${parts.slice(1,3).join(',')}</span>`;
                    div.addEventListener('click', () => {
                        map.setView([parseFloat(item.lat), parseFloat(item.lon)], 17);
                        searchResults.style.display = 'none';
                        searchInput.value = '';
                    });
                    searchResults.appendChild(div);
                });

                searchResults.style.display = 'block';
            } catch (e) {
                searchResults.style.display = 'none';
            }
        }
    </script>
</body>
</html>
