<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FF6B35">
<title>🍔 Fast Food — Menyu</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ─── CSS Variables (Telegram theme) ─────────────────────────────── */
:root {
  --bg:        var(--tg-theme-bg-color, #ffffff);
  --text:      var(--tg-theme-text-color, #1a1a2e);
  --hint:      var(--tg-theme-hint-color, #8888aa);
  --link:      var(--tg-theme-link-color, #FF6B35);
  --btn:       var(--tg-theme-button-color, #FF6B35);
  --btn-text:  var(--tg-theme-button-text-color, #ffffff);
  --secondary: var(--tg-theme-secondary-bg-color, #f5f5f8);
  --card-r: 18px;
  --transition: 0.2s cubic-bezier(.4,0,.2,1);
}

/* ─── Reset & Base ─────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
button { cursor: pointer; font-family: inherit; }
img { display: block; }

/* ─── Loading Screen ───────────────────────────────────────────── */
#loading {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px;
  transition: opacity .4s ease, visibility .4s ease;
}
#loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.loading-icon {
  width: 80px; height: 80px; border-radius: 24px;
  background: linear-gradient(135deg, #FF6B35, #f7c59f);
  display: flex; align-items: center; justify-content: center;
  font-size: 44px;
  animation: loadPulse 1s ease-in-out infinite alternate;
  box-shadow: 0 12px 40px rgba(255,107,53,.35);
}
@keyframes loadPulse {
  from { transform: scale(1); box-shadow: 0 12px 40px rgba(255,107,53,.35); }
  to   { transform: scale(1.08); box-shadow: 0 18px 50px rgba(255,107,53,.5); }
}
.loading-dots {
  display: flex; gap: 8px;
}
.loading-dots span {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--btn);
  animation: dotBounce .8s ease-in-out infinite;
}
.loading-dots span:nth-child(2) { animation-delay: .16s; }
.loading-dots span:nth-child(3) { animation-delay: .32s; }
@keyframes dotBounce {
  0%,80%,100% { transform: translateY(0); opacity:.5; }
  40%          { transform: translateY(-12px); opacity:1; }
}
.loading-text { color: var(--hint); font-size: 15px; }

/* ─── Header ───────────────────────────────────────────────────── */
.header {
  position: sticky; top: 0; z-index: 200;
  background: var(--bg);
  padding: 12px 16px 10px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid rgba(128,128,128,.12);
  backdrop-filter: blur(12px) saturate(1.6);
  -webkit-backdrop-filter: blur(12px) saturate(1.6);
}
.header-logo {
  display: flex; align-items: center; gap: 10px;
  font-size: 19px; font-weight: 800; letter-spacing: -.3px;
}
.header-logo-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, #FF6B35, #f7c59f);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  box-shadow: 0 4px 12px rgba(255,107,53,.3);
}
.cart-btn {
  position: relative;
  background: var(--btn);
  color: var(--btn-text);
  border: none;
  border-radius: 20px;
  padding: 7px 16px 7px 12px;
  font-size: 14px; font-weight: 700;
  display: flex; align-items: center; gap: 6px;
  transition: transform var(--transition), opacity var(--transition);
  box-shadow: 0 4px 14px rgba(255,107,53,.3);
}
.cart-btn:active { transform: scale(.93); opacity:.85; }
.cart-btn-count {
  background: rgba(255,255,255,.25);
  border-radius: 10px;
  padding: 1px 7px;
  font-size: 13px; font-weight: 800;
  min-width: 22px; text-align: center;
  transition: transform .2s;
}
.cart-btn-count.bump { animation: bump .25s ease; }
@keyframes bump { 50% { transform: scale(1.4); } }

/* ─── Category Tabs ────────────────────────────────────────────── */
.cats {
  position: sticky; top: 61px; z-index: 190;
  background: var(--bg);
  border-bottom: 1px solid rgba(128,128,128,.1);
  padding: 10px 16px 10px;
  display: flex; gap: 8px; overflow-x: auto;
  scroll-behavior: smooth; scrollbar-width: none;
}
.cats::-webkit-scrollbar { display: none; }
.cat-tab {
  flex-shrink: 0;
  padding: 7px 16px; border-radius: 22px;
  font-size: 14px; font-weight: 600;
  border: 1.5px solid rgba(128,128,128,.2);
  background: transparent; color: var(--text);
  transition: all var(--transition);
  white-space: nowrap;
}
.cat-tab.active {
  background: var(--btn);
  color: var(--btn-text);
  border-color: var(--btn);
  box-shadow: 0 4px 12px rgba(255,107,53,.25);
}

/* ─── Products Grid ────────────────────────────────────────────── */
#products {
  padding: 12px 12px 120px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.section-title {
  grid-column: 1 / -1;
  font-size: 17px; font-weight: 800;
  padding: 10px 4px 2px;
  display: flex; align-items: center; gap: 8px;
}

/* ─── Product Card ─────────────────────────────────────────────── */
.card {
  background: var(--secondary);
  border-radius: var(--card-r);
  overflow: hidden;
  display: flex; flex-direction: column;
  transition: transform var(--transition), box-shadow var(--transition);
}
.card:active { transform: scale(.97); }
.card-img-wrap {
  position: relative; width: 100%; padding-top: 72%;
  overflow: hidden; background: rgba(128,128,128,.08);
}
.card-img {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
  transition: transform .4s ease;
}
.card:active .card-img { transform: scale(1.04); }
.card-img-ph {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 52px;
  background: linear-gradient(135deg, rgba(255,107,53,.08), rgba(255,107,53,.14));
}
.badge-sale {
  position: absolute; top: 8px; left: 8px;
  background: #ff3b30; color: #fff;
  font-size: 11px; font-weight: 800;
  padding: 3px 8px; border-radius: 10px;
  letter-spacing: .3px;
}
.card-body {
  padding: 10px 12px 4px;
  flex: 1; display: flex; flex-direction: column; gap: 3px;
}
.card-name {
  font-size: 13px; font-weight: 700; line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-old-price {
  font-size: 11px; color: var(--hint); text-decoration: line-through;
}
.card-price {
  font-size: 15px; font-weight: 800; color: var(--btn);
  margin-top: auto; padding-top: 2px;
}
.card-actions { padding: 8px 12px 12px; }
.add-btn {
  width: 100%; padding: 9px;
  background: var(--btn); color: var(--btn-text);
  border: none; border-radius: 12px;
  font-size: 13px; font-weight: 700;
  transition: opacity var(--transition), transform .1s;
}
.add-btn:active { opacity:.8; transform: scale(.97); }
.qty-ctrl {
  display: none;
  align-items: center;
  background: rgba(128,128,128,.12);
  border-radius: 12px; overflow: hidden;
}
.qty-btn {
  width: 38px; height: 38px; border: none;
  background: var(--btn); color: var(--btn-text);
  font-size: 22px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  transition: opacity .15s;
}
.qty-btn:active { opacity:.7; }
.qty-num {
  flex: 1; text-align: center;
  font-size: 15px; font-weight: 800;
  color: var(--text);
}

/* ─── Cart Bottom Bar ──────────────────────────────────────────── */
.cart-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 300;
  padding: 10px 16px 16px;
  background: var(--bg);
  border-top: 1px solid rgba(128,128,128,.14);
  backdrop-filter: blur(12px) saturate(1.6);
  -webkit-backdrop-filter: blur(12px) saturate(1.6);
  transform: translateY(100%);
  transition: transform .35s cubic-bezier(.4,0,.2,1);
}
.cart-bar.visible { transform: translateY(0); }
.cart-bar-btn {
  width: 100%; padding: 14px 20px;
  background: linear-gradient(135deg, #FF6B35, #e85d26);
  color: #fff;
  border: none; border-radius: 16px;
  font-size: 16px; font-weight: 800;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 8px 24px rgba(255,107,53,.45);
  transition: transform var(--transition), opacity var(--transition);
}
.cart-bar-btn:active { transform: scale(.98); opacity:.9; }

/* ─── Cart Modal ───────────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0; z-index: 400;
  background: rgba(0,0,0,.5);
  display: flex; align-items: flex-end;
  opacity: 0; visibility: hidden;
  transition: opacity .3s, visibility .3s;
  backdrop-filter: blur(2px);
}
.overlay.open { opacity: 1; visibility: visible; }
.drawer {
  background: var(--bg);
  border-radius: 24px 24px 0 0;
  padding: 0 16px 24px;
  width: 100%;
  max-height: 80vh; overflow-y: auto;
  transform: translateY(100%);
  transition: transform .35s cubic-bezier(.4,0,.2,1);
}
.overlay.open .drawer { transform: translateY(0); }
.drawer-handle {
  width: 40px; height: 4px; border-radius: 2px;
  background: rgba(128,128,128,.25);
  margin: 14px auto 16px;
}
.drawer-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.drawer-title { font-size: 19px; font-weight: 800; }
.drawer-close {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--secondary); border: none;
  font-size: 18px; color: var(--hint);
  display: flex; align-items: center; justify-content: center;
}
.cart-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(128,128,128,.1);
}
.ci-img {
  width: 54px; height: 54px; border-radius: 12px;
  object-fit: cover; flex-shrink: 0;
  background: rgba(128,128,128,.08);
}
.ci-ph {
  width: 54px; height: 54px; border-radius: 12px;
  background: rgba(255,107,53,.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; flex-shrink: 0;
}
.ci-info { flex: 1; min-width: 0; }
.ci-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ci-price { font-size: 13px; color: var(--hint); margin-top: 2px; }
.ci-remove {
  background: none; border: none;
  color: #ff3b30; font-size: 22px; padding: 4px; flex-shrink: 0;
  transition: transform .15s;
}
.ci-remove:active { transform: scale(.85); }
.cart-total-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 0 4px;
  font-size: 16px; font-weight: 800;
}
.cart-total-amount { color: var(--btn); font-size: 20px; }
.checkout-btn {
  width: 100%; padding: 15px;
  background: linear-gradient(135deg, #FF6B35, #e85d26);
  color: #fff; border: none; border-radius: 16px;
  font-size: 16px; font-weight: 800;
  margin-top: 12px;
  box-shadow: 0 8px 24px rgba(255,107,53,.4);
  transition: opacity var(--transition), transform .1s;
}
.checkout-btn:active { opacity:.9; transform: scale(.99); }
.checkout-btn:disabled { opacity:.5; transform: none; }

/* ─── Empty Cart in Drawer ─────────────────────────────────────── */
.empty-cart {
  text-align: center; padding: 36px 0;
  color: var(--hint); font-size: 15px;
}
.empty-cart span { font-size: 48px; display: block; margin-bottom: 12px; }

/* ─── Toast ─────────────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 90px; left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: rgba(30,30,40,.92);
  color: #fff; padding: 10px 20px;
  border-radius: 22px; font-size: 14px; font-weight: 600;
  white-space: nowrap; z-index: 9000;
  opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s;
  backdrop-filter: blur(8px);
}
.toast.show {
  opacity: 1; transform: translateX(-50%) translateY(0);
}

/* ─── Error State ───────────────────────────────────────────────── */
.error-state {
  grid-column: 1/-1;
  text-align: center; padding: 60px 20px;
  color: var(--hint);
}
.error-state span { font-size: 52px; display: block; margin-bottom: 16px; }
.retry-btn {
  margin-top: 16px; padding: 10px 28px;
  background: var(--btn); color: var(--btn-text);
  border: none; border-radius: 12px;
  font-size: 15px; font-weight: 700;
}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="loading-icon">🍔</div>
  <div class="loading-dots">
    <span></span><span></span><span></span>
  </div>
  <div class="loading-text" id="loadingText">Yuklanmoqda...</div>
</div>

<!-- Header -->
<header class="header">
  <div class="header-logo">
    <div class="header-logo-icon">🍔</div>
    <span id="headerTitle">Menyu</span>
  </div>
  <button class="cart-btn" id="cartBtn" onclick="openCart()">
    🛒 <span class="cart-btn-count" id="cartCount">0</span>
  </button>
</header>

<!-- Category Tabs -->
<nav class="cats" id="cats"></nav>

<!-- Products -->
<main id="products"></main>

<!-- Cart Bottom Bar -->
<div class="cart-bar" id="cartBar">
  <button class="cart-bar-btn" id="cartBarBtn" onclick="openCart()">
    <span id="barLeft">🛒 0 ta</span>
    <span id="barRight">0 so'm →</span>
  </button>
</div>

<!-- Cart Drawer -->
<div class="overlay" id="overlay" onclick="onOverlayClick(event)">
  <div class="drawer" id="drawer">
    <div class="drawer-handle"></div>
    <div class="drawer-head">
      <div class="drawer-title" id="drawerTitle">🛒 Savat</div>
      <button class="drawer-close" onclick="closeCart()">✕</button>
    </div>
    <div id="cartList"></div>
    <div class="cart-total-row">
      <span id="totalLabel">Jami:</span>
      <span class="cart-total-amount" id="totalAmt">0</span>
    </div>
    <button class="checkout-btn" id="checkoutBtn" onclick="submitOrder()">
      <span id="checkoutText">✅ Buyurtma berish</span>
    </button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ─── Telegram WebApp ────────────────────────────────────────────────
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ─── Language Detection ──────────────────────────────────────────────
const urlLang = new URLSearchParams(location.search).get('lang') || '';
const tgLang  = (tg?.initDataUnsafe?.user?.language_code || 'uz').toLowerCase();
const lang    = urlLang || (tgLang.startsWith('ru') ? 'ru' : tgLang.startsWith('en') ? 'en' : 'uz');

// ─── Translations ────────────────────────────────────────────────────
const T = {
  uz: {
    loading:'Yuklanmoqda...', menu:'Menyu', cart:'Savat',
    total:'Jami:', order:'✅ Buyurtma berish', add:'+ Qo\'shish',
    items: n => `${n} ta mahsulot`,
    total_str: n => `${n.toLocaleString('uz-UZ')} so'm`,
    empty_cart:'Savat bo\'sh', added:'✅ Savatga qo\'shildi!',
    cart_warn:'⚠️ Savat bo\'sh!', sending:'Yuborilmoqda...',
    error:'Xatolik. Qaytadan urinib ko\'ring.',
    retry:'Qayta yuklash',
  },
  ru: {
    loading:'Загрузка...', menu:'Меню', cart:'Корзина',
    total:'Итого:', order:'✅ Заказать', add:'+ Добавить',
    items: n => `${n} товар`,
    total_str: n => `${n.toLocaleString('ru-RU')} сум`,
    empty_cart:'Корзина пуста', added:'✅ Добавлено!',
    cart_warn:'⚠️ Корзина пуста!', sending:'Отправляем...',
    error:'Ошибка. Попробуйте снова.',
    retry:'Перезагрузить',
  },
  en: {
    loading:'Loading...', menu:'Menu', cart:'Cart',
    total:'Total:', order:'✅ Place Order', add:'+ Add',
    items: n => `${n} item${n!==1?'s':''}`,
    total_str: n => `${n.toLocaleString('en-US')} sum`,
    empty_cart:'Cart is empty', added:'✅ Added to cart!',
    cart_warn:'⚠️ Cart is empty!', sending:'Sending...',
    error:'Error occurred. Please retry.',
    retry:'Reload',
  }
};
const t = T[lang] || T.uz;

// ─── State ────────────────────────────────────────────────────────────
let menuData  = [];
let cart      = {};   // { [productId]: { product, qty } }
let toastTid  = null;

// ─── Helpers ─────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const cartCount = () => Object.values(cart).reduce((s,v) => s+v.qty, 0);
const cartTotal = () => Object.values(cart).reduce((s,v) => s+v.product.price*v.qty, 0);
function fmtPrice(n) { return t.total_str(n); }
function pname(p) {
  return lang==='ru'?(p.name_ru||p.name):lang==='en'?(p.name_en||p.name):p.name;
}

function showToast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTid);
  toastTid = setTimeout(()=>el.classList.remove('show'), 2000);
}

// ─── Cart UI Update ───────────────────────────────────────────────────
function updateUI() {
  const cnt   = cartCount();
  const total = cartTotal();

  // Header badge
  const cc = $('cartCount');
  cc.textContent = cnt;
  cc.classList.remove('bump');
  requestAnimationFrame(()=> cc.classList.add('bump'));

  // Bottom bar
  const bar = $('cartBar');
  if (cnt > 0) {
    bar.classList.add('visible');
    $('barLeft').textContent  = '🛒 ' + t.items(cnt);
    $('barRight').textContent = fmtPrice(total) + ' →';
  } else {
    bar.classList.remove('visible');
  }

  // Product card controls
  for (const pid in cart) {
    setCardQty(parseInt(pid), cart[pid]?.qty || 0);
  }
}

function setCardQty(pid, qty) {
  const addBtn  = $(`add-${pid}`);
  const qtyCtrl = $(`qty-ctrl-${pid}`);
  const qtyNum  = $(`qty-num-${pid}`);
  if (!addBtn) return;
  if (qty > 0) {
    addBtn.style.display      = 'none';
    qtyCtrl.style.display     = 'flex';
    if (qtyNum) qtyNum.textContent = qty;
  } else {
    addBtn.style.display      = 'block';
    qtyCtrl.style.display     = 'none';
  }
}

// ─── Cart Actions ─────────────────────────────────────────────────────
function addToCart(pid) {
  const product = findProduct(pid);
  if (!product) return;
  if (cart[pid]) {
    cart[pid].qty++;
  } else {
    cart[pid] = { product, qty: 1 };
  }
  updateUI();
  showToast(t.added);
}

function dec(pid) {
  if (!cart[pid]) return;
  cart[pid].qty--;
  if (cart[pid].qty <= 0) {
    delete cart[pid];
    setCardQty(pid, 0);
  } else {
    setCardQty(pid, cart[pid].qty);
  }
  updateUI();
}

function findProduct(pid) {
  for (const cat of menuData)
    for (const p of cat.products)
      if (p.id === pid) return p;
  return null;
}

// ─── Cart Drawer ──────────────────────────────────────────────────────
function openCart() {
  if (cartCount() === 0) { showToast(t.cart_warn); return; }
  renderDrawer();
  $('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeCart() {
  $('overlay').classList.remove('open');
  document.body.style.overflow = '';
}
function onOverlayClick(e) {
  if (e.target === $('overlay')) closeCart();
}

function renderDrawer() {
  $('drawerTitle').textContent  = '🛒 ' + t.cart;
  $('totalLabel').textContent   = t.total;
  $('totalAmt').textContent     = fmtPrice(cartTotal());
  $('checkoutText').textContent = t.order;

  const list = $('cartList');
  list.innerHTML = '';

  if (cartCount() === 0) {
    list.innerHTML = `<div class="empty-cart"><span>🛒</span>${t.empty_cart}</div>`;
    return;
  }

  for (const [pid, {product, qty}] of Object.entries(cart)) {
    const nm = pname(product);
    const imgEl = product.image_url
      ? `<img class="ci-img" src="${escHtml(product.image_url)}" loading="lazy"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        + `<div class="ci-ph" style="display:none">🍽</div>`
      : `<div class="ci-ph">🍽</div>`;

    list.insertAdjacentHTML('beforeend', `
      <div class="cart-item" id="ci-${pid}">
        ${imgEl}
        <div class="ci-info">
          <div class="ci-name">${escHtml(nm)}</div>
          <div class="ci-price">${qty} × ${fmtPrice(product.price)}</div>
        </div>
        <button class="ci-remove" onclick="removeItem(${pid})">✕</button>
      </div>`
    );
  }
}

function removeItem(pid) {
  delete cart[pid];
  setCardQty(parseInt(pid), 0);
  const ci = $(`ci-${pid}`);
  if (ci) ci.remove();
  $('totalAmt').textContent = fmtPrice(cartTotal());
  if (cartCount() === 0) {
    closeCart();
    $('cartList').innerHTML = '';
  }
  updateUI();
}

// ─── Submit Order ─────────────────────────────────────────────────────
function submitOrder() {
  if (cartCount() === 0) { showToast(t.cart_warn); return; }
  if (!tg?.sendData) {
    showToast(t.error); return;
  }

  const btn = $('checkoutBtn');
  btn.disabled = true;
  $('checkoutText').textContent = t.sending + ' ⏳';

  const items = Object.entries(cart).map(([pid, {product, qty}]) => ({
    product_id: parseInt(pid),
    quantity:   qty,
    price:      product.price,
    name:       product.name,
  }));

  const payload = JSON.stringify({
    type:  'webapp_cart',
    items,
    total: cartTotal(),
    lang,
  });

  try {
    tg.sendData(payload);
  } catch (err) {
    console.error(err);
    btn.disabled = false;
    $('checkoutText').textContent = t.order;
    showToast(t.error);
  }
}

// ─── Render Menu ──────────────────────────────────────────────────────
function renderMenu(data) {
  const catsEl  = $('cats');
  const prodsEl = $('products');
  catsEl.innerHTML  = '';
  prodsEl.innerHTML = '';

  if (!data.categories?.length) {
    prodsEl.innerHTML = `<div class="error-state"><span>😔</span>Menyu bo'sh</div>`;
    return;
  }

  data.categories.forEach((cat, idx) => {
    const cn = lang==='ru'?(cat.name_ru||cat.name):lang==='en'?(cat.name_en||cat.name):cat.name;

    // Tab
    const tab = document.createElement('button');
    tab.className = 'cat-tab' + (idx===0?' active':'');
    tab.id = `tab-${cat.id}`;
    tab.textContent = (cat.emoji||'') + ' ' + cn;
    tab.onclick = () => scrollToSection(cat.id);
    catsEl.appendChild(tab);

    // Section title
    const sec = document.createElement('div');
    sec.className = 'section-title'; sec.id = `sec-${cat.id}`;
    sec.textContent = (cat.emoji||'🍽') + ' ' + cn;
    prodsEl.appendChild(sec);

    // Product cards
    cat.products.forEach(p => buildCard(p, prodsEl));
  });
}

function buildCard(p, parent) {
  const nm  = pname(p);
  const hasSale = p.old_price && p.old_price > p.price;
  const discPct = hasSale ? Math.round((1-p.price/p.old_price)*100) : 0;

  const imgEl = p.image_url
    ? `<img class="card-img" src="${escHtml(p.image_url)}" loading="lazy"
            alt="${escHtml(nm)}"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      + `<div class="card-img-ph" style="display:none">🍽</div>`
    : `<div class="card-img-ph">🍽</div>`;

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-img-wrap">
      ${imgEl}
      ${hasSale?`<div class="badge-sale">-${discPct}%</div>`:''}
    </div>
    <div class="card-body">
      <div class="card-name">${escHtml(nm)}</div>
      ${hasSale?`<div class="card-old-price">${(p.old_price).toLocaleString()} so'm</div>`:''}
      <div class="card-price">${(p.price).toLocaleString()} so'm</div>
    </div>
    <div class="card-actions">
      <button class="add-btn" id="add-${p.id}" onclick="addToCart(${p.id})">${t.add}</button>
      <div class="qty-ctrl" id="qty-ctrl-${p.id}">
        <button class="qty-btn" onclick="dec(${p.id})">−</button>
        <span class="qty-num" id="qty-num-${p.id}">1</span>
        <button class="qty-btn" onclick="addToCart(${p.id})">+</button>
      </div>
    </div>`;
  parent.appendChild(card);
}

// ─── Scroll tracking ──────────────────────────────────────────────────
function scrollToSection(catId) {
  const sec = $(`sec-${catId}`);
  if (!sec) return;
  const hh = document.querySelector('.header').offsetHeight;
  const ch = $('cats').offsetHeight;
  const top = sec.offsetTop - hh - ch - 6;
  window.scrollTo({ top, behavior: 'smooth' });
  setActiveTab(catId);
}

function setActiveTab(catId) {
  document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));
  const tab = $(`tab-${catId}`);
  if (tab) {
    tab.classList.add('active');
    tab.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
  }
}

function setupScrollObs() {
  const hh = document.querySelector('.header').offsetHeight;
  const ch = $('cats').offsetHeight;
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        setActiveTab(e.target.id.replace('sec-',''));
      }
    });
  }, { rootMargin:`-${hh+ch+4}px 0px -60% 0px` });
  document.querySelectorAll('.section-title').forEach(el=>observer.observe(el));
}

// ─── Fetch & Load ─────────────────────────────────────────────────────
async function loadMenu() {
  $('loadingText').textContent = t.loading;
  $('headerTitle').textContent = t.menu;
  $('drawerTitle').textContent = '🛒 '+t.cart;
  $('checkoutText').textContent= t.order;

  try {
    const baseUrl = location.origin;
    const res = await fetch(`${baseUrl}/api/menu?lang=${lang}`, {
      cache: 'default',
      headers: { 'Accept': 'application/json' },
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    menuData = data.categories || [];
    renderMenu(data);

    // Hide loading
    const loadEl = $('loading');
    loadEl.classList.add('hidden');
    setTimeout(()=>{ loadEl.style.display='none'; }, 450);

    setupScrollObs();
  } catch (err) {
    console.error('Menu load error:', err);
    $('loading').style.display = 'none';
    $('products').innerHTML = `
      <div class="error-state">
        <span>😵</span>
        ${t.error}
        <br>
        <button class="retry-btn" onclick="location.reload()">${t.retry}</button>
      </div>`;
  }
}

// ─── Escape HTML ──────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Init ─────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', loadMenu);
</script>
</body>
</html>
