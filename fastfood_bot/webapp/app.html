        tg.ready();

        tg?.HapticFeedback?.impactOccurred(style);

      try {

      : (urlParams.get('user_id') || urlParams.get('uid') || localStorage.getItem('tg_uid') || '');

    if (initialUid) {
      localStorage.setItem('tg_uid', initialUid);
    }

    // ─── Secure Fetch Helper (HMAC-SHA256 Telegram initData header) ────
    async function secureFetch(url, options = {}) {
      const headers = {
        ...(options.headers || {}),
        'X-Telegram-Init-Data': tg?.initData || '',
      };
      return fetch(url, { ...options, headers });
    }

    // ─── Formatters ────────────────────────────────────────────────────
    function formatUzPhone(digitsOnly) {
      const clean = (digitsOnly || '').replace(/\D/g, '').slice(0, 9);
      if (clean.length === 0) return '';
      if (clean.length <= 2) return `(${clean}`;
      if (clean.length <= 5) return `(${clean.slice(0, 2)}) ${clean.slice(2)}`;
      if (clean.length <= 7) return `(${clean.slice(0, 2)}) ${clean.slice(2, 5)}-${clean.slice(5)}`;
      return `(${clean.slice(0, 2)}) ${clean.slice(2, 5)}-${clean.slice(5, 7)}-${clean.slice(7, 9)}`;
    }

    // ─── Reverse Geocode Helper (Always returns human-readable place name, never raw GPS) ───
    async function reverseGeocodePlaceName(la, lo) {
      try {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/reverse?format=json&lat=${la}&lon=${lo}&zoom=18&addressdetails=1&accept-language=uz,ru`
        );
        if (res.ok) {
          const data = await res.json();
          const addr = data.address || {};
          const city = addr.city || addr.town || addr.county || addr.state || '';
          const district =
            addr.city_district ||
            addr.suburb ||
            addr.borough ||
            addr.quarter ||
            addr.neighbourhood ||
            addr.residential ||
            addr.village ||
            '';
          const road = addr.road || addr.pedestrian || addr.footway || addr.street || '';
          const house = addr.house_number || '';
          const poi = data.name || addr.amenity || addr.shop || addr.building || '';

          const parts = [];
          if (city) parts.push(city);
          if (district && !parts.includes(district)) parts.push(district);
          if (road && !parts.includes(road)) {
            parts.push(house ? `${road}, ${house}-uy` : road);
          } else if (house) {
            parts.push(`${house}-uy`);
          }
          if (poi && !parts.includes(poi)) parts.push(poi);

          if (parts.length > 0) return parts.join(', ');
          if (data.display_name) {
            const clean = data.display_name
              .split(',')
              .map((p) => p.trim())
              .filter((p) => p && !/^\d+$/.test(p))
              .slice(0, 3)
              .join(', ');
            if (clean) return clean;
          }
        }
      } catch (e) {}

      try {
        const bRes = await fetch(
          `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${la}&longitude=${lo}&localityLanguage=uz`
        );
        if (bRes.ok) {
          const bData = await bRes.json();
          const bParts = [bData.city || bData.principalSubdivision, bData.locality].filter(Boolean);
          if (bParts.length > 0) return [...new Set(bParts)].join(', ');
        }
      } catch (e) {}

      return 'Xaritadan aniqlangan manzil';
    }

    // ─── Interactive Map Picker Component ──────────────────────────────
    function DeliveryMapPicker({ lat, lon, onPickLocation }) {
      const mapRef = useRef(null);
      const instanceRef = useRef(null);

      useEffect(() => {
        if (!mapRef.current || instanceRef.current) return;
        const startLat = lat || 39.7661;
        const startLon = lon || 64.4184;

        const map = L.map(mapRef.current).setView([startLat, startLon], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '© OpenStreetMap',
        }).addTo(map);

        const marker = L.marker([startLat, startLon], { draggable: true }).addTo(map);

        const resolveAddr = async (la, lo) => {
          const placeName = await reverseGeocodePlaceName(la, lo);
          onPickLocation(la, lo, placeName);
        };

        resolveAddr(startLat, startLon);

        marker.on('dragend', () => {
          const pos = marker.getLatLng();
          resolveAddr(pos.lat, pos.lng);
        });

        map.on('click', (e) => {
          marker.setLatLng(e.latlng);
          resolveAddr(e.latlng.lat, e.latlng.lng);
        });

        instanceRef.current = map;
        setTimeout(() => map.invalidateSize(), 200);

        return () => {
          map.remove();
          instanceRef.current = null;
        };
      }, []);

      return (
        <div className="space-y-2">
          <div
            ref={mapRef}
            className="w-full h-48 rounded-2xl overflow-hidden border border-neutral-200 z-10"
          />
        </div>
      );
    }

    // ─── Main Application ──────────────────────────────────────────────
    function DarxanMiniApp() {
      const storagePhoneKey = `darxan_phone_${initialUid || 'guest'}`;
      const initialSavedPhone =
        localStorage.getItem(storagePhoneKey) || localStorage.getItem('user_phone') || '';
      const initialSavedDigits = (() => {
        const d = initialSavedPhone.replace(/\D/g, '');
        const clean9 = d.startsWith('998') ? d.slice(3, 12) : d.slice(-9);
        return clean9 === '901234567' ? '' : clean9;
      })();
      const hasInitialSavedPhone = initialSavedDigits.length === 9;

      // Agar mijoz oldin raqamini kiritgan bo'lsa, o'zi "Изменить" bosmaguncha doim 'verified' holatda turadi
      const isEditingPhoneRef = useRef(false);

      const requestedTab = urlParams.get('tab');
      const initialTab = ['home', 'cart', 'orders', 'profile'].includes(requestedTab)
        ? requestedTab
        : 'profile';

      // 3. Bottom Navigation Bar: default active is 'profile' (yoki URL ?tab=orders bo'lsa 'orders')
      const [activeTab, setActiveTab] = useState(initialTab);

      // 1. Auth & OTP State
      // 'phone' | 'otp' | 'verified'
      const [authStep, setAuthStep] = useState(hasInitialSavedPhone ? 'verified' : 'phone');
      const [phoneDigits, setPhoneDigits] = useState(
        hasInitialSavedPhone ? initialSavedDigits : ''
      );
      const [sendMethod, setSendMethod] = useState('telegram'); // 'telegram' | 'sms'
      const [otpDigits, setOtpDigits] = useState(['', '', '', '', '', '']);
      const [otpTimer, setOtpTimer] = useState(57);
      const [demoOtpHint, setDemoOtpHint] = useState('');
      const [authNotice, setAuthNotice] = useState('');

      // 2. Payment Method State — server qaysi usullar sozlanganini aytguncha faqat Naqd
      const [paymentMethod, setPaymentMethod] = useState('cash');
      const [paymentConfig, setPaymentConfig] = useState({ cash: true, payme: false, click: false });

      useEffect(() => {
        (async () => {
          try {
            const res = await fetch(`${API_BASE}/api/payment-config`);
            if (!res.ok) return;
            const cfg = await res.json();
            const normalized = { cash: true, payme: !!cfg.payme, click: !!cfg.click };
            setPaymentConfig(normalized);
            // Avvalgidek Payme standart bo'lsin (agar sozlangan bo'lsa)
            setPaymentMethod((prev) =>
              prev !== 'cash' && normalized[prev]
                ? prev
                : normalized.payme ? 'payme' : normalized.click ? 'click' : 'cash'
            );
          } catch (e) {}
        })();
      }, []);

      // Catalog, Cart, User & Orders State
      const [categories, setCategories] = useState(FALLBACK_CATEGORIES);
      const [selectedCatId, setSelectedCatId] = useState(1);
      const [searchQuery, setSearchQuery] = useState('');
      const [favorites, setFavorites] = useState(new Set());
      const [userProfile, setUserProfile] = useState({
        id: initialUid,
        name: tg?.initDataUnsafe?.user?.first_name || 'Гость Darxan',
        phone: hasInitialSavedPhone ? `+998 ${formatUzPhone(initialSavedDigits)}` : '',
        is_admin: false,
      });
      const ordersStorageKey = `darxan_orders_${initialUid || 'guest'}`;
      const [orders, setOrders] = useState(() => {
        try {
          const raw =
            localStorage.getItem(ordersStorageKey) ||
            localStorage.getItem('darxan_orders_history') ||
            '[]';
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
      });

      const saveOrdersToStorage = useCallback(
        (ordersList) => {
          try {
            const serialized = JSON.stringify(ordersList);
            localStorage.setItem(ordersStorageKey, serialized);
            localStorage.setItem('darxan_orders_history', serialized);
          } catch (e) {}
        },
        [ordersStorageKey]
      );

      // Savat dastlab bo'sh bo'ladi (mijoz o'zi taom qo'shmaguncha Savatda (1) chiqmaydi)
      const [cart, setCart] = useState({});

      // Delivery & Promo State
      const [deliveryType, setDeliveryType] = useState('delivery'); // 'delivery' | 'eat_in'
      const [selectedBranchId, setSelectedBranchId] = useState(1); // 1: Abu Ali ibn Sino, 2: 5-mikrorayon
      const [tableNumber, setTableNumber] = useState('');
      const [addressMode, setAddressMode] = useState('text'); // 'gps' | 'text' | 'map'
      const [addressText, setAddressText] = useState('');
      const [coords, setCoords] = useState({ lat: null, lon: null });
      const [gpsStatus, setGpsStatus] = useState('');
      const [nearestBranchInfo, setNearestBranchInfo] = useState(null);
      const [promoInput, setPromoInput] = useState('');
      const [appliedPromo, setAppliedPromo] = useState({ code: '', pct: 0 });
      const [promoStatus, setPromoStatus] = useState(null);
      const [submittingOrder, setSubmittingOrder] = useState(false);
      const [orderSuccessModal, setOrderSuccessModal] = useState(null);

      // Raqamni doimiy saqlash (localStorage + Backend DB)
      const persistVerifiedPhone = useCallback(
        async (fullPhoneStr) => {
          if (!fullPhoneStr) return;
          localStorage.setItem(storagePhoneKey, fullPhoneStr);
          localStorage.setItem('user_phone', fullPhoneStr);
          isEditingPhoneRef.current = false;
          setUserProfile((prev) => ({ ...prev, phone: fullPhoneStr }));
          setAuthStep('verified');
          if (initialUid) {
            try {
              await secureFetch(`${API_BASE}/api/profile/update`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: initialUid, phone: fullPhoneStr }),
              });
            } catch (e) {}
          }
        },
        [storagePhoneKey]
      );

      // Foydalanuvchi va buyurtmalar holatini serverdan yangilash funksiyasi
      const fetchUserOrders = useCallback(async () => {
        const localPhone =
          localStorage.getItem(storagePhoneKey) || localStorage.getItem('user_phone') || '';
        const localDigits = (() => {
          const d = localPhone.replace(/\D/g, '');
          const c9 = d.startsWith('998') ? d.slice(3, 12) : d.slice(-9);
          return c9 === '901234567' ? '' : c9;
        })();
        const liveTgUid =
          (window.Telegram?.WebApp?.initDataUnsafe?.user?.id &&
            String(window.Telegram.WebApp.initDataUnsafe.user.id)) ||
          urlParams.get('user_id') ||
          urlParams.get('uid') ||
          initialUid ||
          localStorage.getItem('tg_uid') ||
          '';

        try {
          const uRes = await secureFetch(
            `${API_BASE}/api/user?user_id=${encodeURIComponent(liveTgUid || '0')}&phone=${encodeURIComponent(localDigits)}`
          );
          if (uRes.ok) {
            const uData = await uRes.json();
            if (uData.user) {
              if (uData.user.id && String(uData.user.id) !== '0') {
                localStorage.setItem('tg_uid', String(uData.user.id));
              }
              const dbPhone = (uData.user.phone || '').trim();
              const effectivePhone = dbPhone || localPhone;

              setUserProfile((prev) => ({
                ...prev,
                ...uData.user,
                phone: effectivePhone || prev.phone,
              }));

              if (effectivePhone) {
                const digits = effectivePhone.replace(/\D/g, '');
                const local9 = digits.startsWith('998') ? digits.slice(3, 12) : digits.slice(-9);
                if (local9.length === 9) {
                  const formatted = `+998 ${formatUzPhone(local9)}`;
                  localStorage.setItem(storagePhoneKey, formatted);
                  localStorage.setItem('user_phone', formatted);
                  if (!isEditingPhoneRef.current) {
                    setPhoneDigits(local9);
                    setAuthStep('verified');
                  }
                  if (!dbPhone && liveTgUid) {
                    secureFetch(`${API_BASE}/api/profile/update`, {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ user_id: liveTgUid, phone: formatted }),
                    }).catch(() => {});
                  }
                }
              }
            }
            if (Array.isArray(uData.orders)) {
              setOrders((prev) => {
                const serverIds = new Set(uData.orders.map((o) => String(o.id)));
                const remainingLocal = (prev || []).filter(
                  (o) => o && o.id && !serverIds.has(String(o.id))
                );
                const merged = [...uData.orders, ...remainingLocal].sort(
                  (a, b) => Number(b.id || 0) - Number(a.id || 0)
                );
                saveOrdersToStorage(merged);
                return merged;
              });
            }
          }
        } catch (e) {}
      }, [storagePhoneKey, saveOrdersToStorage]);

      // Jonli yangilanish (Real-time polling): Zakaz bo'limida har 4 soniyada kafe javobini tekshiradi
      useEffect(() => {
        const interval = setInterval(() => {
          fetchUserOrders();
        }, 4000);
        return () => clearInterval(interval);
      }, [fetchUserOrders]);

      // ── Kodning o'zi to'lov amalga oshirilganini avtomatik aniqlashi (Auto Payment Detection) ──
      useEffect(() => {
        if (!orderSuccessModal || !orderSuccessModal.paymentUrl || orderSuccessModal.isPaidConfirmed) return;
        const targetOrdId = orderSuccessModal.orderId;
        let isMounted = true;
        const interval = setInterval(async () => {
          try {
            const res = await secureFetch(`${API_BASE}/api/order/payment-status?order_id=${targetOrdId}`);
            if (res.ok) {
              const data = await res.json();
              if (data && data.paid && isMounted) {
                hapticNotify('success');
                setOrderSuccessModal((prev) => (prev ? { ...prev, isPaidConfirmed: true } : null));
                fetchUserOrders();
              }
            }
          } catch (e) {}
        }, 2500);
        return () => {
          isMounted = false;
          clearInterval(interval);
        };
      }, [orderSuccessModal, fetchUserOrders]);

      // Load real menu & user data from backend
      useEffect(() => {
        async function fetchInitialData() {
          try {
            const res = await fetch(`${API_BASE}/api/menu`);
            if (res.ok) {
              const data = await res.json();
              if (data.categories && data.categories.length > 0) {
                setCategories(data.categories);
                setSelectedCatId(data.categories[0].id);
              }
            }
          } catch (e) {}

          await fetchUserOrders();
        }
        fetchInitialData();
      }, [fetchUserOrders]);

      // OTP Countdown Timer
      useEffect(() => {
        if (authStep !== 'otp') return;
        if (otpTimer <= 0) return;
        const interval = setInterval(() => {
          setOtpTimer((prev) => (prev > 0 ? prev - 1 : 0));
        }, 1000);
        return () => clearInterval(interval);
      }, [authStep, otpTimer]);

      // Auto-verify when all 6 OTP boxes are filled
      useEffect(() => {
        const code = otpDigits.join('');
        if (authStep === 'otp' && code.length === 6 && !otpDigits.includes('')) {
          const fullPhone = `+998 ${formatUzPhone(phoneDigits)}`;
          (async () => {
            try {
              const res = await secureFetch(`${API_BASE}/api/auth/verify-otp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  user_id: initialUid || 0,
                  phone: fullPhone,
                  code,
                }),
              });
              if (res.ok) {
                localStorage.setItem(storagePhoneKey, fullPhone);
                localStorage.setItem('user_phone', fullPhone);
                isEditingPhoneRef.current = false;
                setUserProfile((prev) => ({ ...prev, phone: fullPhone }));
                hapticNotify('success');
                setAuthNotice('Номер успешно подтвержден!');
                setTimeout(() => {
                  setAuthStep('verified');
                }, 450);
              } else {
                const errData = await res.json().catch(() => ({}));
                hapticNotify('error');
                setOtpDigits(['', '', '', '', '', '']);
                alert(errData.error || 'Неверный код подтверждения');
              }
            } catch (e) {}
          })();
        }
      }, [otpDigits, authStep, phoneDigits]);

      // Phone input handler
      const handlePhoneChange = (e) => {
        const raw = e.target.value.replace(/\D/g, '');
        const clean = raw.startsWith('998') ? raw.slice(3) : raw;
        setPhoneDigits(clean.slice(0, 9));
      };

      // Send OTP Code ("Выслать код")
      const handleSendCode = async () => {
        if (phoneDigits.length < 9) {
          hapticNotify('error');
          alert('Пожалуйста, введите полный номер телефона (+998 XX XXX-XX-XX)');
          return;
        }
        hapticImpact('medium');
        const fullPhone = `+998 ${formatUzPhone(phoneDigits)}`;
        // Mijoz raqamini kiritishi bilanoq localStorage va bazaga saqlab qo'yamiz,
        // shunda WebAppdan chiqib qayta kirganda ham raqami o'chib ketmaydi
        localStorage.setItem(storagePhoneKey, fullPhone);
        localStorage.setItem('user_phone', fullPhone);
        setUserProfile((prev) => ({ ...prev, phone: fullPhone }));
        if (initialUid) {
          secureFetch(`${API_BASE}/api/profile/update`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: initialUid, phone: fullPhone }),
          }).catch(() => {});
        }
        setOtpDigits(['', '', '', '', '', '']);
        setOtpTimer(57);
        setAuthNotice('');
        setDemoOtpHint('');
        setAuthStep('otp');

        try {
          const res = await secureFetch(`${API_BASE}/api/auth/send-otp`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              user_id: initialUid || 0,
              phone: fullPhone,
              method: sendMethod,
            }),
          });
          if (res.ok) {
            const data = await res.json();
            if (data.demo_code) {
              setDemoOtpHint(data.demo_code);
            }
          }
        } catch (e) {}
      };

      // Keypad handlers
      const handleOtpDigit = useCallback((digit) => {
        setOtpDigits((prev) => {
          const emptyIndex = prev.findIndex((val) => val === '');
          if (emptyIndex === -1) return prev;
          const updated = [...prev];
          updated[emptyIndex] = digit;
          return updated;
        });
      }, []);

      const handleOtpBackspace = useCallback(() => {
        setOtpDigits((prev) => {
          const revIdx = [...prev].reverse().findIndex((val) => val !== '');
          if (revIdx === -1) return prev;
          const realIdx = 5 - revIdx;
          const updated = [...prev];
          updated[realIdx] = '';
          return updated;
        });
      }, []);

      const handleOtpClear = useCallback(() => {
        setOtpDigits(['', '', '', '', '', '']);
      }, []);

      // Cart Helpers
      const cartItems = useMemo(() => Object.values(cart), [cart]);
      const cartCount = useMemo(
        () => cartItems.reduce((sum, item) => sum + item.qty, 0),
        [cartItems]
      );
      const itemsSubtotal = useMemo(
        () => cartItems.reduce((sum, item) => sum + item.price * item.qty, 0),
        [cartItems]
      );
      const discountAmount = useMemo(
        () => (appliedPromo.pct > 0 ? Math.round((itemsSubtotal * appliedPromo.pct) / 100) : 0),
        [itemsSubtotal, appliedPromo.pct]
      );
      const afterDiscount = itemsSubtotal - discountAmount;
      const computedDeliveryFee =
        nearestBranchInfo?.nearest_branch?.delivery_fee || 10000;
      const deliveryFee =
        deliveryType === 'delivery' && cartCount > 0 ? computedDeliveryFee : 0;
      const finalTotal = afterDiscount + deliveryFee;

      // Eng yaqin filialni aniqlash (Geo-routing API)
      const fetchNearestBranch = useCallback(async (la, lo) => {
        if (la === null || lo === null || la === undefined || lo === undefined) return;
        try {
          const res = await fetch(
            `${API_BASE}/api/branches/nearest?lat=${encodeURIComponent(la)}&lon=${encodeURIComponent(lo)}`
          );
          if (res.ok) {
            const data = await res.json();
            if (data && data.nearest_branch) {
              setNearestBranchInfo(data);
              if (data.nearest_branch.id) {
                setSelectedBranchId(Number(data.nearest_branch.id));
              }
              return;
            }
          }
        } catch (e) {}
      }, []);

      const addToCart = (product) => {
        hapticImpact('light');
        setCart((prev) => {
          const existing = prev[product.id];
          return {
            ...prev,
            [product.id]: {
              id: product.id,
              name: product.name_ru || product.name,
              price: product.price,
              image_url: product.image_url,
              qty: existing ? existing.qty + 1 : 1,
            },
          };
        });
      };

      const removeFromCart = (productId) => {
        hapticImpact('light');
        setCart((prev) => {
          const existing = prev[productId];
          if (!existing) return prev;
          if (existing.qty <= 1) {
            const copy = { ...prev };
            delete copy[productId];
            return copy;
          }
          return {
            ...prev,
            [productId]: { ...existing, qty: existing.qty - 1 },
          };
        });
      };

      // Promo Code Check
      const handleCheckPromo = async () => {
        const code = promoInput.trim().toUpperCase();
        if (!code) return;
        hapticImpact('light');
        try {
          const res = await fetch(
            `${API_BASE}/api/promo?code=${encodeURIComponent(code)}&user_id=${initialUid || 0}`
          );
          if (res.ok) {
            const d = await res.json();
            if (d.valid) {
              setAppliedPromo({ code, pct: d.discount_percent || 0 });
              setPromoStatus({ ok: true, msg: `Промокод ${code} применен (-${d.discount_percent}%)` });
              hapticNotify('success');
              return;
            }
          }
        } catch (e) {}
        setPromoStatus({ ok: false, msg: 'Промокод не найден или истек' });
        hapticNotify('error');
      };

      // GPS Location (Aniq joy nomini aniqlaydi — hech qachon xom GPS koordinata yubormaydi)
      const handleRequestGps = () => {
        if (!navigator.geolocation) {
          setGpsStatus('Геолокация не поддерживается');
          return;
        }
        setGpsStatus('⏳ Определение точного адреса...');
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const la = pos.coords.latitude;
            const lo = pos.coords.longitude;
            setCoords({ lat: la, lon: lo });
            fetchNearestBranch(la, lo);
            const placeName = await reverseGeocodePlaceName(la, lo);
            setAddressText(placeName);
            setGpsStatus(`📍 Манзил: ${placeName}`);
            hapticNotify('success');
          },
          () => {
            setGpsStatus('Не удалось определить локацию');
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      };

      // Place Order
      const handlePlaceOrder = async () => {
        if (cartItems.length === 0) return;

        const activePhone =
          userProfile.phone ||
          (phoneDigits.length === 9 ? `+998 ${formatUzPhone(phoneDigits)}` : '');
        if (!activePhone) {
          alert('Пожалуйста, введите ваш номер телефона в разделе Профиль');
          setActiveTab('profile');
          isEditingPhoneRef.current = true;
          setAuthStep('phone');
          return;
        }

        if (deliveryType === 'eat_in' && !tableNumber.trim()) {
          hapticNotify('error');
          alert('Iltimos, stol raqamingizni tanlang yoki kiriting! / Пожалуйста, укажите номер стола!');
          return;
        }

        if (
          deliveryType === 'delivery' &&
          nearestBranchInfo &&
          nearestBranchInfo.in_delivery_zone === false
        ) {
          hapticNotify('error');
          alert(
            nearestBranchInfo.error ||
              'Afsuski, bu manzil bizning yetkazib berish zonamizdan tashqarida'
          );
          return;
        }

        let resolvedAddress = addressText.trim();
        if (
          deliveryType === 'delivery' &&
          coords.lat &&
          coords.lon &&
          (!resolvedAddress || /^gps\s*:/i.test(resolvedAddress))
        ) {
          resolvedAddress = await reverseGeocodePlaceName(coords.lat, coords.lon);
          setAddressText(resolvedAddress);
        }

        const cleanTable = tableNumber.trim().replace(/^#/, '');
        const finalAddress =
          deliveryType === 'eat_in'
            ? `Stol raqami: #${cleanTable}`
            : resolvedAddress || 'Доставка по адресу клиента';

        const paymentLabelMap = {
          cash: '💵 Наqd (Yetkazib berilganda)',
          payme: '💳 Online to\'lov (Payme)',
          click: '💳 Online to\'lov (Click)',
        };

        const payload = {
          user_id: Number(initialUid) || 0,
          phone: activePhone,
          items: cartItems.map((i) => ({ product_id: i.id, quantity: i.qty })),
          delivery_type: deliveryType,
          branch_id:
            deliveryType === 'eat_in'
              ? selectedBranchId
              : nearestBranchInfo?.nearest_branch?.id || null,
          address: finalAddress,
          payment_method: paymentLabelMap[paymentMethod] || paymentLabelMap.payme,
          promo_code: appliedPromo.code || promoInput.trim().toUpperCase() || null,
          lat: coords.lat,
          lon: coords.lon,
        };

        setSubmittingOrder(true);
        try {
          const res = await secureFetch(`${API_BASE}/api/order/create`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const data = await res.json();

          if (data.success) {
            hapticNotify('success');
            const newOrdId = data.order_id || Math.floor(100 + Math.random() * 900);
            const newOrdTotal = data.total_amount || finalTotal;
            const chosenPayUrl = data.payment_url || null;

            // Agar Payme yoki Click tanlangan bo'lsa — to'g'ridan-to'g'ri ilovaga o'tish
            if (chosenPayUrl) {
              try {
                if (window.Telegram?.WebApp?.openLink) {
                  window.Telegram.WebApp.openLink(chosenPayUrl);
                } else {
                  window.open(chosenPayUrl, '_blank');
                }
              } catch (openErr) {}
            }

            const createdOrderObj = {
              id: newOrdId,
              status: 'pending',
              total_amount: newOrdTotal,
              delivery_type: deliveryType,
              delivery_address: finalAddress,
              branch_name:
                data.branch_name ||
                nearestBranchInfo?.nearest_branch?.name ||
                null,
              distance_km:
                data.distance_km ??
                nearestBranchInfo?.nearest_branch?.distance_km ??
                null,
              payment_method: paymentLabelMap[paymentMethod] || 'Payme',
              payment_url: chosenPayUrl,
              created_at: new Date().toISOString().replace('T', ' ').slice(0, 16),
              items: cartItems.map((i) => ({
                product_id: i.id,
                name: i.name,
                quantity: i.qty,
                price_at_time: i.price,
              })),
            };
            setOrders((prev) => {
              const updated = [
                createdOrderObj,
                ...prev.filter((o) => String(o.id) !== String(newOrdId)),
              ];
              saveOrdersToStorage(updated);
              return updated;
            });
            setOrderSuccessModal({
              orderId: newOrdId,
              total: newOrdTotal,
              payment: paymentMethod === 'cash' ? 'Наличные' : paymentMethod.toUpperCase(),
              paymentMethod: paymentMethod,
              paymentUrl: chosenPayUrl,
              paymeUrl: data.payme_url || null,
              clickUrl: data.click_url || null,
            });
            setCart({});
            fetchUserOrders();
          } else {
            alert(data.error || 'Ошибка при оформлении заказа');
          }
        } catch (e) {
          // Demo / offline preview fallback
          hapticNotify('success');
          const demoId = Math.floor(100 + Math.random() * 900);
          const demoOrderObj = {
            id: demoId,
            status: 'pending',
            total_amount: finalTotal,
            delivery_type: deliveryType,
            delivery_address: finalAddress,
            payment_method: paymentLabelMap[paymentMethod] || 'Payme',
            created_at: new Date().toISOString().replace('T', ' ').slice(0, 16),

                              : '💖 Buyurtma topshirildi — Yoqimli ishtaha!',
                            message: isEatIn
                              ? "✨ Buyurtmangiz stolingizga muvaffaqiyatli yetkazildi! Darxan Burger'ni tanlaganingiz uchun katta rahmat! Yana kutib qolamiz 🍔❤️"
                              : "✨ Buyurtmangiz muvaffaqiyatli yetkazildi! Darxan Burger'ni tanlaganingiz uchun katta rahmat! Yana kutib qolamiz 🍔❤️",
                            step: 4,
                          },
                          cancelled: {
                            badge: '😔 Taom tugab qoldi',
                            badgeClass: 'bg-[#E50914]/15 text-[#E50914] border border-[#E50914]/30',
                            cardBorder: 'border-rose-200/90 bg-gradient-to-br from-rose-50/80 via-white to-white',
                            bannerBg: 'bg-[#E50914]/10 border-[#E50914]/25 text-rose-950',
                            icon: '😔',
                            title: '😔 Ming bor uzr, bu taomimiz hozircha tugab qolibdi!',
                            message:
                              "💔 Afsuski, siz tanlagan bu taomimiz hozirgina tugab qolibdi yoki oshxonada juda katta navbat yuzaga keldi. Iltimos, menyumizdan boshqa issiq va mazali burgerlarimizni tanlab ko'ring! ❤️🍔",
                            step: 0,
                          },
                        };

                        const cfg = statusConfigMap[st] || statusConfigMap.pending;
                        const ordItems = Array.isArray(ord.items) ? ord.items : [];
                        const progressSteps = isEatIn
                          ? [
                              { s: 1, lbl: 'Kafeda' },
                              { s: 2, lbl: 'Qabul qilindi' },
                              { s: 3, lbl: 'Tayyorlandi' },
                              { s: 4, lbl: 'Yetkazildi' },
                            ]
                          : [
                              { s: 1, lbl: 'Kafeda' },
                              { s: 2, lbl: 'Qabul qilindi' },
                              { s: 3, lbl: "Yo'lda" },
                              { s: 4, lbl: 'Yetkazildi' },
                            ];

                        return (
                          <div
                            key={ord.id}
                            className={`p-4 rounded-2xl border-2 space-y-3 transition-all ${cfg.cardBorder}`}
                          >
                            {/* Top Row: Order ID, Date & Status Badge */}
                            <div className="flex items-center justify-between gap-2">
                              <div>
                                <div className="flex items-center gap-2">
                                  <span className="text-base font-extrabold text-neutral-900">
                                    Buyurtma #{ord.id}
                                  </span>
                                  <span className="text-[11px] font-semibold text-neutral-400">
                                    • {isEatIn ? '🍽 Shu yerda' : '🛵 Yetkazish'}
                                  </span>
                                </div>
                                {ord.created_at && (
                                  <span className="block text-[10.5px] font-medium text-neutral-400 mt-0.5">
                                    🕒 {String(ord.created_at).slice(0, 16)}
                                  </span>
                                )}
                              </div>
                              <span className={`text-[11px] font-extrabold px-2.5 py-1 rounded-full shrink-0 ${cfg.badgeClass}`}>
                                {cfg.badge}
                              </span>
                            </div>

                            {/* Nearest Branch if present */}
                            {ord.branch_name && (
                              <div className="text-[11.5px] font-semibold text-emerald-800 bg-emerald-500/10 px-3 py-1.5 rounded-xl border border-emerald-500/20">
                                🏢 Filial:{' '}
                                <span className="font-bold">
                                  {ord.branch_name}
                                  {ord.distance_km ? ` (${ord.distance_km} km)` : ''}
                                </span>
                              </div>
                            )}

                            {/* Delivery Address or Table Number if present */}
                            {ord.delivery_address && (
                              <div className="text-[11.5px] font-semibold text-neutral-600 bg-white/80 px-3 py-1.5 rounded-xl border border-neutral-200/60">
                                {isEatIn ? '🪑 Stol:' : '📍 Manzil:'}{' '}
                                <span className="font-bold text-neutral-800">{ord.delivery_address}</span>
                              </div>
                            )}

                            {/* Attractive Status Message Banner */}
                            <div className={`p-3 rounded-xl border ${cfg.bannerBg} space-y-1`}>
                              <div className="text-xs font-extrabold flex items-center gap-1.5">
                                <span className="text-base">{cfg.icon}</span>
                                <span>{cfg.title}</span>
                              </div>
                              <p className="text-[11.5px] leading-relaxed font-medium opacity-90">
                                {cfg.message}
                              </p>
                            </div>

                            {/* 4-Step Progress Bar (for non-cancelled orders) */}
                            {st !== 'cancelled' ? (
                              <div className="grid grid-cols-4 gap-1.5 pt-0.5">
                                {progressSteps.map((stepObj) => {
                                  const activeStep = cfg.step >= stepObj.s;
                                  return (
                                    <div key={stepObj.s} className="space-y-1 text-center">
                                      <div
                                        className={`h-1.5 rounded-full transition-all ${
                                          activeStep ? 'bg-emerald-500' : 'bg-neutral-200'
                                        }`}
                                      />
                                      <span
                                        className={`block text-[9.5px] font-bold ${
                                          activeStep ? 'text-emerald-700' : 'text-neutral-400'
                                        }`}
                                      >
                                        {stepObj.lbl}
                                      </span>
                                    </div>
                                  );
                                })}
                              </div>
                            ) : (
                              <button
                                type="button"
                                onClick={() => setActiveTab('home')}
                                className="w-full py-2.5 rounded-xl bg-[#E50914] text-white text-xs font-bold shadow-sm active:scale-95 transition-transform"
                              >
                                🍔 Menyudan boshqa taom tanlash
                              </button>
                            )}

                            {/* Ordered Items List (if available) */}
                            {ordItems.length > 0 && (
                              <div className="pt-2 border-t border-neutral-200/60 space-y-1">
                                {ordItems.map((it, idx) => (
                                  <div key={idx} className="flex justify-between text-xs text-neutral-600 font-medium">
                                    <span>
                                      ▫️ {it.name_ru || it.name || `Mahsulot #${it.product_id}`} × {it.quantity}
                                    </span>
                                    {it.price_at_time && (
                                      <span className="font-semibold text-neutral-800">
                                        {formatPrice(it.price_at_time * it.quantity)} so'm
                                      </span>
                                    )}
                                  </div>
                                ))}
                              </div>
                            )}

                            {/* Footer: Payment & Total Price */}
                            <div className="flex items-center justify-between pt-2 border-t border-neutral-200/70">
                              <span className="text-[11px] font-semibold text-neutral-500">
                                {ord.payment_method || 'Naqd / Online'}
                              </span>
                              <span className="text-sm font-extrabold text-[#E50914]">
                                Jami: {formatPrice(ord.total_amount)} so'm
                              </span>
                            </div>

                            {/* Direct Payme / Click Payment Action if pending/active */}
                            {(String(ord.payment_method || '').toLowerCase().includes('payme') ||
                              String(ord.payment_method || '').toLowerCase().includes('click')) &&
                              ord.status !== 'completed' &&
                              ord.status !== 'cancelled' && (
                                <div className="pt-2 space-y-1.5">
                                  {ord.payment_status === 'paid' ? (
                                    <div className="w-full py-2 px-3 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold flex items-center justify-center gap-1.5">
                                      <span>✅ To'langan (Oshxonaga qabul qilindi)</span>
                                    </div>
                                  ) : (
                                    <>
                                      {ord.payment_url && (
                                      <button
                                        type="button"
                                        onClick={() => {
                                          hapticImpact('medium');
                                          const link = ord.payment_url;
                                          if (window.Telegram?.WebApp?.openLink) {
                                            window.Telegram.WebApp.openLink(link);
                                          } else {
                                            window.open(link, '_blank');
                                          }
                                        }}
                                        className="w-full py-2.5 px-3 rounded-xl bg-neutral-900 text-white text-xs font-bold flex items-center justify-center gap-1.5 active:scale-95 transition-transform shadow-sm"
                                      >
                                        <span>
                                          {String(ord.payment_method || '').toLowerCase().includes('click')
                                            ? '🔹 Click ilovasida to\'lash'
                                            : '💳 Payme ilovasida to\'lash'}
                                        </span>
                                      </button>
                                      )}
                                      <div className="w-full py-1.5 px-2.5 rounded-xl bg-amber-50 text-amber-800 border border-amber-200 text-[10px] font-medium flex items-center justify-center gap-1.5">
                                        <span className="w-1.5 h-1.5 rounded-full bg-amber-500 animate-ping inline-block flex-shrink-0"></span>
                                        <span>To'lov kutilmoqda (Kod avtomatik aniqlaydi)</span>
                                      </div>
                                    </>
                                  )}
                                </div>
                              )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* ─── Custom Numeric Keypad (Fixed at bottom above Nav when on OTP screen) ─── */}
          {activeTab === 'profile' && authStep === 'otp' && (
            <div className="fixed bottom-16 left-0 right-0 z-40">
              <CustomNumericKeypad
                onDigit={handleOtpDigit}
                onBackspace={handleOtpBackspace}
                onClear={handleOtpClear}
              />
            </div>
          )}

          {/* ─── Order Success Modal ─── */}
          {orderSuccessModal && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full text-center space-y-4 animate-ios-in shadow-2xl">
                {orderSuccessModal.isPaidConfirmed ? (
                  <>
                    <div className="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-3xl mx-auto shadow-inner">
                      ✅
                    </div>
                    <h3 className="text-lg font-extrabold text-neutral-900">
                      To'lov muvaffaqiyatli qabul qilindi!
                    </h3>
                    <p className="text-xs text-neutral-600 leading-relaxed">
                      Buyurtma <b>#{orderSuccessModal.orderId}</b> to'lovi to'liq tasdiqlandi. Buyurtmangiz oshxona filialiga yuborildi va tayyorlanmoqda!
                    </p>
                    <div className="py-2.5 px-3 rounded-xl bg-emerald-50 text-emerald-800 text-xs font-bold flex items-center justify-center gap-1.5 border border-emerald-200">
                      <span>🍳 Oshxonada tayyorlanmoqda</span>
                    </div>
                  </>
                ) : (
                  <>
                    <div className="w-16 h-16 rounded-full bg-[#E50914]/10 text-[#E50914] flex items-center justify-center text-3xl mx-auto">
                      {orderSuccessModal.paymentUrl ? '💳' : '⏳'}
                    </div>
                    <h3 className="text-lg font-extrabold text-neutral-900">
                      {orderSuccessModal.paymentUrl
                        ? "To'lov kutilmoqda..."
                        : 'Buyurtmangiz kafega yuborildi!'}
                    </h3>
                    <p className="text-xs text-neutral-500 leading-relaxed">
                      Buyurtma <b>#{orderSuccessModal.orderId}</b> (<b>{formatPrice(orderSuccessModal.total)} so'm</b>) qabul qilindi.
                      {orderSuccessModal.paymentUrl
                        ? " To'lovni ilova orqali bajaring. Kod to'lovni avtomatik aniqlagach, buyurtma darhol oshxonaga yo'naltiriladi:"
                        : ' Kafe buyurtmani qabul qilishi bilan «Заказ» bo\'limida holati darhol yangilanadi!'}
                    </p>

                    {orderSuccessModal.paymentUrl && (
                      <div className="space-y-2.5 pt-1">
                        <button
                          type="button"
                          onClick={() => {
                            hapticImpact('medium');
                            if (window.Telegram?.WebApp?.openLink) {
                              window.Telegram.WebApp.openLink(orderSuccessModal.paymentUrl);
                            } else {
                              window.open(orderSuccessModal.paymentUrl, '_blank');
                            }
                          }}
                          className="w-full py-3.5 rounded-2xl bg-[#E50914] text-white font-extrabold text-xs shadow-[0_6px_20px_rgba(229,9,20,0.3)] flex items-center justify-center gap-2 active:scale-95 transition-transform"
                        >
                          {orderSuccessModal.paymentMethod === 'click' ? (
                            <span>🔹 Click ilovasida to'lash</span>
                          ) : (
                            <span>💳 Payme ilovasida to'lash</span>
                          )}
                        </button>

                        <div className="py-2.5 px-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-[11px] font-medium flex items-center justify-center gap-2">
                          <span className="w-2 h-2 rounded-full bg-amber-500 animate-ping inline-block flex-shrink-0"></span>
                          <span>Kod to'lovni avtomatik tekshirmoqda...</span>
                        </div>
                      </div>
                    )}
                  </>
                )}

                <button
                  type="button"
                  onClick={() => {
                    setOrderSuccessModal(null);
                    setActiveTab('orders');
                    fetchUserOrders();
                  }}
                  className={`w-full py-3.5 rounded-2xl font-bold text-xs transition-colors ${
                    orderSuccessModal.isPaidConfirmed || !orderSuccessModal.paymentUrl
                      ? 'bg-[#E50914] text-white shadow-md'
                      : 'bg-neutral-100 text-neutral-700 hover:bg-neutral-200'
                  }`}
                >
                  📦 Buyurtma holatini kuzatish
                </button>
              </div>
            </div>
          )}

          {/* ─── 3. Bottom Navigation Bar ─── */}
          <BottomNavBar
            activeTab={activeTab}
            onSelectTab={(tab) => {
              setActiveTab(tab);
              if (tab === 'orders') {
                fetchUserOrders();
              }
            }}
            cartBadge={cartCount}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DarxanMiniApp />);
  </script>
</body>
</html>
